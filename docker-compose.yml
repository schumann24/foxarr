services:
  foxarr:
    build: .
    container_name: foxarr
    restart: unless-stopped
    environment:
      FOXARR_DATABASE: /data/foxarr.db
      FOXARR_ROOT_FOLDER: /movies
      FOXARR_QUALITY_PROFILE_ID: "1"
      FOXARR_QUALITY_PROFILE_NAME: Any
      FOXARR_DRY_RUN: "true"
      FOXARR_DOWNLOAD_DIR: /downloads/foxarr
      # Prowlarr runs on the Docker host in the current lab setup.
      # FOXARR_PROWLARR_URL: http://host.docker.internal:9696
      # FOXARR_PROWLARR_API_KEY: change-me
      # FOXARR_API_KEY: change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - foxarr-data:/data

volumes:
  foxarr-data:
