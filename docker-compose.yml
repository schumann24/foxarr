services:
  foxarr:
    build: .
    container_name: foxarr
    restart: unless-stopped
    environment:
      FOXARR_DATABASE: /data/foxarr.db
      FOXARR_ROOT_FOLDER: /movies
      FOXARR_QUALITY_PROFILE_ID: "1"
      FOXARR_QUALITY_PROFILE_NAME: Any <= 8 GB, 5+ seeders
      FOXARR_DRY_RUN: "true"
      # These are paths on the Transmission host (trustno1), not in Foxarr.
      FOXARR_TRANSMISSION_MOVIE_DIR: /home/blackfox/data/film
      FOXARR_TRANSMISSION_SERIES_DIR: /home/blackfox/data/serial
      # Leave unset until real Transmission control is explicitly approved.
      # FOXARR_TRANSMISSION_RPC_URL: http://transmission:9091/transmission/rpc
      # FOXARR_TRANSMISSION_RPC_USERNAME: ***
      # FOXARR_TRANSMISSION_RPC_PASSWORD: ***
      FOXARR_SELECTION_PROFILES_JSON: '{"1":{"name":"Any <= 8 GB, 5+ seeders","criteria":{"maxSize":8000000000,"minSeeders":5}}}'
      # Prowlarr runs on the Docker host in the current lab setup.
      # FOXARR_PROWLARR_URL: http://host.docker.internal:9696
      # FOXARR_PROWLARR_API_KEY: change-me
      # FOXARR_API_KEY: change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - foxarr-data:/data

volumes:
  foxarr-data:
