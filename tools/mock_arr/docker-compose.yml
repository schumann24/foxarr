services:
  mock-radarr:
    build: .
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "7878"]
    environment:
      - ROLE=radarr
      - FOXARR_MOCK_STATE=/data/state-radarr.json
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ./data:/data
    networks:
      - foxarr-lab

  mock-sonarr:
    build: .
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8989"]
    environment:
      - ROLE=sonarr
      - FOXARR_MOCK_STATE=/data/state-sonarr.json
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ./data:/data
    networks:
      - foxarr-lab

networks:
  foxarr-lab:
    external: true
